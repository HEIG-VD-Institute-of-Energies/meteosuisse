[project]
name = "meteosuisse"
version = "0.1.0"
description = "MeteoSwiss Open Data Python Interface"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pandas>=2.2.2",
    "loguru>=0.7.2",
    "rich>=13.7.1",
    "orjson>=3.10.7",
    "python-dateutil>=2.9.0.post0",
    "tenacity>=9.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
