[project]
name = "meteosuisse"
version = "0.1.0"
description = "MeteoSwiss Open Data Python Interface"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pandas>=2.2.2",
    "loguru>=0.7.2",
    "rich>=13.7.1",
    "orjson>=3.10.7",
    "python-dateutil>=2.9.0.post0",
    "tenacity>=9.0.0",
    "shapely>=2.0.0"
]

[project.scripts]
meteosuisse = "meteosuisse.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "black>=25.11.0",
    "isort>=7.0.0",
    "mypy>=1.18.2",
    "pytest>=9.0.1",
    "pytest-cov>=5.0.0",
    "vcrpy>=6.0.1",
    "respx>=0.21.1",
    "ruff>=0.14.5",
]
